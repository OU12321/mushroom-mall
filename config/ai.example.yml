# 本地私密配置示例：复制为 config/ai.yml 后填写；ai.yml 已被 Git 忽略。
# 也可以不改此文件，改用 MUSHROOM_DB_PASSWORD、MUSHROOM_JWT_SECRET、
# MUSHROOM_AI_API_KEY 环境变量。
spring:
  datasource:
    password: 请填写你的本地MySQL密码

mushroom:
  # 使用足够长的随机字符串，不要使用下面的示例值。
  jwt-secret: 请填写至少32位的本地随机JWT签名密钥
  ai:
    # 留空时 AI 助手会降级为关键词匹配，商城其他功能不受影响。
    api-key: ${MUSHROOM_AI_API_KEY:}
